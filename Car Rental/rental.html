<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarWeb</title>
    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
      .swiper {
        width: 100%;
        padding: 3rem 0;
      }

      .swiper-slide {
        background: #3b535e;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(72, 103, 118, 0.25);
        overflow: hidden;
        text-align: left;
        width: 290px !important;
        transition: box-shadow 0.3s ease;
      }

      .swiper-slide:hover {
        box-shadow: 0 10px 30px rgba(44, 113, 181, 0.45);
      }

      .filtered-car-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
      }

      .car-card {
        width: 250px;
        border: 1.5px solid #66ccff; /* icy blue border */
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(102, 204, 255, 0.3);
        background: #d4c9be; /* very light icy blue background */
        text-align: center;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease,
          border-color 0.3s ease;
        color: #2069b3; /* deep blue text */
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
        user-select: none;
      }

      .car-card:hover {
        transform: scale(1.07);
        box-shadow: 0 12px 25px rgba(51, 153, 255, 0.6);
        border-color: #3399ff;
      }

      .car-card:active {
        transform: scale(0.95);
        box-shadow: 0 6px 15px rgba(51, 153, 255, 0.5);
        border-color: #66ccff;
      }

      .car-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 12px;
        border: 2px solid #cceeff; /* icy light border */
        box-shadow: 0 0 8px rgba(102, 204, 255, 0.25);
        transition: box-shadow 0.3s ease;
      }

      .car-card img:hover {
        box-shadow: 0 0 15px rgba(51, 153, 255, 0.6);
      }

      .car-info {
        padding: 1rem;
        color: aliceblue; /* text color */
        font-size: 1rem;
        line-height: 1.4;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background: rgba(
          0,
          0,
          0,
          0.7
        ); /* keep modal background dark for focus */
      }

      .modal-content {
        background: #f0f9ff; /* icy light background */
        margin: 10% auto;
        padding: 20px;
        width: 80%;
        max-width: 500px;
        border-radius: 12px;
        animation: fadeIn 0.3s ease;
        color: #003366;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .close {
        float: right;
        font-size: 24px;
        cursor: pointer;
        color: #007acc;
      }

      .book-btn {
        margin-top: 12px;
        padding: 10px 16px;
        background-color: #3399ff; /* icy blue button */
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 4px 10px rgba(51, 153, 255, 0.5);
      }

      .book-btn:hover {
        background-color: #007acc;
        box-shadow: 0 6px 15px rgba(0, 122, 204, 0.7);
      }

      #particles-wrapper {
        position: relative;
        width: 100%;
        height: 100vh; /* Full screen */
        overflow: hidden;
      }

      #particles-js {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .filter-overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 2;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .filter-box {
        background: rgba(230, 245, 255, 0.95); /* frosty glass effect */
        backdrop-filter: blur(14px);
        border-radius: 14px;
        padding: 50px 50px;
        box-shadow: 0 10px 30px rgba(102, 204, 255, 0.4);
        border: 2px solid #3399ff;
        text-align: center;
        max-width: 250px;
        width: 80%;
        color: #4a6e92;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        transition: box-shadow 0.3s ease;
      }

      .filter-box:hover {
        box-shadow: 0 0 30px 10px #3399ff;
      }

      .filter-box h2 {
        margin-bottom: 25px;
        color: #49243e;
        font-weight: 800;
        font-size: 2.4rem;
        letter-spacing: 1.3px;
      }

      .filter-box input {
        background: #ecdfcc;
        color: #704264;
        border: 1.5px solid #49243e;
        border-radius: 10px;
        padding: 10px 15px;
        font-size: 1rem;
        font-weight: 600;
        transition: background-color 0.3s ease, border-color 0.3s ease;
      }

      .filter-box input::placeholder {
        color: #743c63;
      }

      .filter-box input:focus {
        outline: none;
        border-color: #007acc;
        box-shadow: 0 0 10px 3px #3399ff;
        background: #cce6ff;
        color: #002244;
      }

      .filter-box button {
        background-color: #743c63;
        color: #bb8493;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(51, 153, 255, 0.6);
        border: 2px solid transparent;
        border-radius: 10px;
        user-select: none;
        padding: 10px 10px;
        margin-top: 10px;
      }

      .filter-box button:hover {
        background-color: #97866a;
        color: #e0f0ff;
        box-shadow: 0 0 20px 8px #6a8699;
        border-color: #6b7e87;
      }

      #filteredCars {
        background: #191e11; /* keep this dark for contrast */
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(51, 153, 255, 0.5);
        max-width: 1200px;
        margin: 20px auto;
        color: #e4e8e4; /* light icy text */
        backdrop-filter: blur(8px);
      }

      #filteredCars .car-card {
        background: #18230f; /* icy light card background */
        border: 0.5px solid #29291c; /* icy border */
        box-shadow: 0 2px 8px #2f2f23;
        color: #525960;
      }

      #cars {
        background: url("https://www.transparenttextures.com/patterns/stardust.png")
            repeat,
          #0a0a0a;
        padding: 60px 20px;
        color: #e0f7ff;
        border-radius: 20px;
        box-shadow: 0 0 10px 3px rgba(51, 153, 255, 0.6),
          0 8px 30px rgba(0, 0, 0, 0.8);
      }

      .wave-divider svg {
        display: block;
        width: 100%;
        height: auto;
        margin-top: -1px;
      }

      /* Navbar Styles - BOLD and Safe */
      .navbar {
        background: linear-gradient(135deg, #111111, #1e1e1e, #333333);
        background-size: 400% 400%;
        animation: navGlow 15s ease infinite;
        padding: 18px 35px;
        position: fixed;
        top: 0;
        width: 93%;
        z-index: 1000;
        box-shadow: 0 0 15px rgba(190, 215, 84, 0.3);
        border-bottom: 1.5px solid #bed754;
      }

      @keyframes navGlow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }

      .logo {
        font-size: 2.2rem;
        font-weight: bold;
        letter-spacing: 1.5px;
        color: #bed754;
        text-shadow: 0 0 10px #bed754, 0 0 20px #ffffff;
        animation: logoPulse 2.5s ease-in-out infinite alternate;
        text-decoration: none;
      }

      @keyframes logoPulse {
        0% {
          text-shadow: 0 0 10px #bed754, 0 0 20px #ffffff;
        }
        100% {
          text-shadow: 0 0 25px #bed754, 0 0 40px #ffffff;
        }
      }

      .nav-links a {
        position: relative;
        color: #f1e7da;
        text-decoration: none;
        margin-left: 25px;
        font-size: 1.1rem;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 6px;
        transition: all 0.3s ease;
      }

      .nav-links a:hover {
        background: #bed754;
        color: #111;
        box-shadow: 0 0 12px #bed754, 0 0 25px #fff;
        transform: scale(1.08);
      }

      .nav-links a.active {
        background: #fff;
        color: #111;
        font-weight: bold;
        box-shadow: 0 0 15px #bed754;
      }

      .typewriter-text {
        position: relative;
        font-size: 4rem;
        font-weight: bold;
        color: #bed754;
        text-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
        white-space: nowrap;
        overflow: hidden;
        border-right: 2px solid #fff;
        width: 0;
        animation: typing 3s steps(10, end) forwards, blink 0.7s infinite;
        z-index: 1;
      }

      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 11ch; /* 'RentoCar' is 8 + 3 spaces for breathing room */
        }
      }

      @keyframes blink {
        0%,
        100% {
          border-color: transparent;
        }
        50% {
          border-color: #fff;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="nav-container">
        <a href="#home" class="logo">RentoCar</a>
        <nav class="nav-links">
          <a href="#home">Home</a>
          <a href="#cars">Cars</a>
          <a href="#particles-wrapper">Filter</a>
          <a href="login.html">Login</a>
          <a href="signup.html">Signup</a>
          <a
            href="#"
            id="logoutLink"
            style="display: none; color: #ff5555; margin-left: 15px"
            >Logout</a
          >
        </nav>
      </div>
    </header>

    <!-- HERO SECTION with video background -->
    <section
      id="hero"
      style="
        position: relative;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      "
    >
      <video
        autoplay
        muted
        loop
        playsinline
        style="
          position: absolute;
          width: 100%;
          height: 100%;
          object-fit: cover;
          z-index: -1;
          filter: brightness(1);
        "
      >
        <source src="video/vdo5.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>

      <!-- Centered website name -->
      <h1 class="typewriter-text" id="rentoText"></h1>
    </section>

    <!-- divider -->

    <div class="wave-divider">
      <svg viewBox="0 0 1440 100">
        <path
          fill="#121212"
          d="M0,0 C480,100 960,0 1440,100 L1440,0 L0,0 Z"
        ></path>
      </svg>
    </div>

    <!-- Car List Section (unchanged) -->
    <section id="cars">
      <h2 style="text-align: center">Available Cars</h2>

      <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="carList">
          <!-- Dynamic car slides will go here -->
        </div>

        <!-- Navigation buttons -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>

        <!-- Pagination dots (optional) -->
        <div class="swiper-pagination"></div>
      </div>
    </section>

    <!-- Filtered Cars with Particle Background -->

    <section id="particles-wrapper">
      <div id="particles-js"></div>

      <div class="filter-overlay">
        <div class="filter-box">
          <h2>Filter Cars</h2>
          <div class="filter-controls">
            <label for="priceFilter">Max Price:</label>
            <input
              type="number"
              id="priceFilter"
              placeholder="Enter Max Rent Price"
            />

            <label for="dateFilter">Available Date:</label>
            <input type="date" id="dateFilter" />

            <button onclick="applyFilters()">Apply Filters</button>
          </div>
        </div>
      </div>
    </section>

    <section
      id="filteredSection"
      style="display: none; padding: 20px; background: #f8f8f8"
    >
      <h2 style="text-align: center; color: #333">Filtered Cars</h2>
      <div id="filteredCars" class="filtered-car-container"></div>
    </section>

    <div style="height: 20px"></div>

    <div
      style="
        width: 100%;
        text-align: center;
        background-color: #111;
        color: white;
        padding: 1rem 0;
        font-size: 1.5rem;
        font-weight: bold;
        letter-spacing: 1px;
      "
    >
      Book Your Ride
    </div>

    <!-- Booking form BELOW the video -->
    <section
      id="booking"
      style="
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 2rem;
        box-sizing: border-box;
      "
    >
      <!-- Background Video -->
      <video
        autoplay
        muted
        loop
        playsinline
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          z-index: 0;
          filter: brightness(0.5);
        "
      >
        <source src="video/vdo6.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>

      <!-- Dark Overlay -->
      <div
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          z-index: 1;
        "
      ></div>

      <!-- Booking Form -->
      <form
        id="bookingForm"
        style="
          position: relative;
          z-index: 2;
          display: flex;
          flex-wrap: wrap;
          gap: 2rem;
          background: rgba(255, 255, 255, 0.1);
          padding: 2rem;
          border-radius: 15px;
          max-width: 1000px;
          width: 100%;
          justify-content: space-between;
          color: white;
        "
      >
        <!-- First Column -->
        <div
          style="
            flex: 1 1 300px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
          "
        >
          <!-- Dropdown of pickup location -->
          <label for="pickup">Pickup Location:</label>
          <select id="pickup" required style="padding: 0.5rem">
            <option value="">Select</option>
            <option value="Dhaka">Dhaka</option>
            <option value="Chittagong">Chittagong</option>
            <option value="Sylhet">Sylhet</option>
          </select>

          <label>
            <input type="checkbox" id="sameLocation" checked />
            Return to same location
          </label>
          <!-- Dropdown of return location -->
          <label for="return" id="returnLabel" style="display: none"
            >Return Location:</label
          >
          <select id="return" style="padding: 0.5rem; display: none">
            <option value="">Select</option>
            <option value="Dhaka">Dhaka</option>
            <option value="Chittagong">Chittagong</option>
            <option value="Sylhet">Sylhet</option>
          </select>
          <!-- Dropdown of country -->
          <label for="country">Country:</label>
          <select id="country" style="padding: 0.5rem">
            <option value="">Select your country</option>
            <option value="Bangladesh">Bangladesh</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
          </select>
          <!-- Dropdown of age-->
          <label for="ageCheck">Are you 18+?</label>
          <select id="ageCheck" style="padding: 0.5rem">
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>

        <!-- Second Column -->
        <div
          style="
            flex: 1 1 300px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
          "
        >
          <label for="pickupDate">Pickup Date:</label>
          <input type="date" id="pickupDate" required style="padding: 0.5rem" />

          <label for="pickupTime">Pickup Time:</label>
          <input type="time" id="pickupTime" required style="padding: 0.5rem" />

          <label for="returnDate">Return Date:</label>
          <input type="date" id="returnDate" required style="padding: 0.5rem" />

          <label for="returnTime">Return Time:</label>
          <input type="time" id="returnTime" required style="padding: 0.5rem" />
        </div>

        <!-- Rent Duration (Center aligned at the bottom) -->
        <div
          style="
            flex-basis: 100%;
            display: flex;
            justify-content: center;
            margin-top: 2rem;
          "
        >
          <div style="min-width: 250px; text-align: center">
            <label
              for="rentDuration"
              style="display: block; margin-bottom: 0.5rem; color: white"
              >Rent Duration:</label
            >
            <select id="rentDuration" style="padding: 0.5rem; width: 100%">
              <option value="">Select duration</option>
              <option value="1">1 Day</option>
              <option value="2">2 Days</option>
              <option value="3">3 Days</option>
            </select>
          </div>
        </div>

        <!-- Book Now Button -->
        <div style="width: 100%; text-align: center; margin-top: 2rem">
          <button
            type="submit"
            style="
              padding: 1rem 2rem;
              font-size: 1.2rem;
              background-color: #ff6600;
              border: none;
              border-radius: 8px;
              color: white;
              cursor: pointer;
              transition: 0.3s;
            "
          >
            Book Now
          </button>
        </div>
      </form>
    </section>

    <!-- pop up -->
    <div id="carModal" class="modal">
      <div class="modal-content" id="modalContent">
        <span class="close" onclick="closeModal()">&times;</span>
        <!-- Car info will be inserted here -->
      </div>
    </div>

    <script>
      // Hide/Show return location dropdown
      const sameLocationCheckbox = document.getElementById("sameLocation");
      const returnLocationSelect = document.getElementById("return");
      const returnLabel = document.getElementById("returnLabel");

      sameLocationCheckbox.addEventListener("change", function () {
        if (this.checked) {
          returnLocationSelect.style.display = "none";
          returnLabel.style.display = "none";
        } else {
          returnLocationSelect.style.display = "block";
          returnLabel.style.display = "block";
        }
      });

      // Load all cars by default
      let cars = [];
      let swiperInstance = null;

      async function loadCarsFromBackend() {
        try {
          const response = await fetch("http://localhost:5000/api/cars");
          cars = await response.json();
          displayCars(cars); // this is for the slider only
        } catch (error) {
          console.error("Error loading cars:", error);
        }
      }

      // Function to display ALL cars in slider
      function displayCars(carArray) {
        const carList = document.getElementById("carList");
        carList.innerHTML = "";

        carArray.forEach((car) => {
          const slide = document.createElement("div");
          slide.className = "swiper-slide";
          slide.innerHTML = `
      <div class="car-card" onclick="alert('Clicked on ${car.name}')">
        <img src="${car.image}" alt="${car.name}" />
        <div class="car-info">
          <h3>${car.name}</h3>
          <p><strong>Brand:</strong> ${car.brand}</p>
          <p><strong>Rent Price:</strong> Tk ${car.rentprice}</p>
          <p><strong>Available:</strong> ${new Date(
            car.availableDate
          ).toLocaleDateString()}</p>
        </div>
      </div>
    `;
          carList.appendChild(slide);
        });

        // Reinitialize Swiper
        if (swiperInstance) swiperInstance.destroy(true, true);

        swiperInstance = new Swiper(".mySwiper", {
          slidesPerView: 1,
          spaceBetween: 20,
          loop: true,
          autoplay: {
            delay: 3000,
            disableOnInteraction: false,
          },
          pagination: {
            el: ".swiper-pagination",
            clickable: true,
          },
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
          breakpoints: {
            640: { slidesPerView: 1 },
            768: { slidesPerView: 2 },
            1024: { slidesPerView: 3 },
          },
        });
      }

      // NEW FUNCTION for displaying filtered cars below the filter section
      function displayFilteredCars(filteredArray) {
        const filteredContainer = document.getElementById("filteredCars");
        filteredContainer.innerHTML = "";

        if (filteredArray.length === 0) {
          filteredContainer.innerHTML =
            "<p style='text-align:center;'>No cars found matching your criteria.</p>";
          return;
        }

        filteredArray.forEach((car) => {
          const carCard = document.createElement("div");
          carCard.className = "car-card";

          carCard.innerHTML = `
      <img src="${car.image}" alt="${car.name}" />
      <div class="car-info">
        <h3>${car.name}</h3>
        <p><strong>Brand:</strong> ${car.brand}</p>
        <p><strong>Rent Price:</strong> Tk ${car.rentprice}</p>
        <p><strong>Available:</strong> ${new Date(
          car.availableDate
        ).toLocaleDateString()}</p>
        <button class="book-btn" onclick="openCarModal(${JSON.stringify(
          car
        ).replace(/"/g, "&quot;")})">
          Book Now;
        </button>
      </div>
    `;

          filteredContainer.appendChild(carCard);
        });
      }

      function openCarModal(car) {
        const modal = document.getElementById("carModal");
        const modalContent = document.getElementById("modalContent");

        modalContent.innerHTML = `
    <span class="close" onclick="closeModal()">&times;</span>
    <img src="${car.image}" alt="${
          car.name
        }" style="width:100%; max-height:250px; object-fit:cover; border-radius:10px;" />
    <h2>${car.name}</h2>
    <p><strong>Brand:</strong> ${car.brand}</p>
    <p><strong>Rent Price:</strong> Tk ${car.rentprice}</p>
    <p><strong>Available Date:</strong> ${new Date(
      car.availableDate
    ).toLocaleDateString()}</p>
    
  `;

        modal.style.display = "block";
      }

      function closeModal() {
        document.getElementById("carModal").style.display = "none";
      }

      //  Modified Filter Logic
      function applyFilters() {
        const maxPriceInput = document.getElementById("priceFilter").value;
        const maxPrice = parseFloat(maxPriceInput);
        const date = document.getElementById("dateFilter").value;
        const filteredSection = document.getElementById("filteredSection");

        let filtered = cars;

        if (!isNaN(maxPrice)) {
          filtered = filtered.filter((c) => c.rentprice <= maxPrice);
        }

        if (date) {
          const selectedDate = new Date(date);
          filtered = filtered.filter(
            (c) => new Date(c.availableDate) >= selectedDate
          );
        }

        const container = document.getElementById("filteredCars");
        container.innerHTML = "";

        if (filtered.length > 0 && (maxPriceInput || date)) {
          filteredSection.style.display = "block";

          filtered.forEach((car) => {
            const card = document.createElement("div");
            card.className = "car-card";
            card.innerHTML = `
        <img src="${car.image}" alt="${car.name}" />
        <div class="car-info">
          <h3>${car.name}</h3>
          <p><strong>Brand:</strong> ${car.brand}</p>
          <p><strong>Rent Price:</strong> Tk ${car.rentprice}</p>
          <p><strong>Available:</strong> ${new Date(
            car.availableDate
          ).toLocaleDateString()}</p>
        </div>
      `;
            card.onclick = () => openCarModal(car);
            container.appendChild(card);
          });
        } else if (maxPriceInput || date) {
          // Show "No cars found" message only if user entered some filter input
          filteredSection.style.display = "block";
          container.innerHTML = `<p style="text-align:center; font-size:18px; color:#555; margin-top: 20px;">
      🚗 No cars found matching your filters! Try changing criteria.
    </p>`;
        } else {
          filteredSection.style.display = "none";
        }
      }

      // 🔥 Search button handler: collect booking form values & fetch matching cars
      async function searchAvailableCars() {
        const pickup = document.getElementById("pickup").value;
        const returnLoc = document.getElementById("return").value;
        const pickupDate = document.getElementById("pickupDate").value;
        const pickupTime = document.getElementById("pickupTime").value;
        const returnDate = document.getElementById("returnDate").value;
        const returnTime = document.getElementById("returnTime").value;

        // Optional dropdowns
        const country = document.getElementById("country").value;
        const age = document.getElementById("age").value;
        const rentDuration = document.getElementById("rentDuration").value;

        if (
          !pickup ||
          !pickupDate ||
          !pickupTime ||
          !returnDate ||
          !returnTime
        ) {
          alert("Please fill all required fields.");
          return;
        }

        // Format date and time as ISO strings
        const fullPickup = `${pickupDate}T${pickupTime}`;
        const fullReturn = `${returnDate}T${returnTime}`;

        // Build query parameters
        const params = new URLSearchParams({
          pickupLocation: pickup,
          returnLocation: returnLoc,
          pickupDate: fullPickup,
          returnDate: fullReturn,
          country,
          age,
          rentDuration,
        });

        try {
          const response = await fetch(
            `http://localhost:5000/api/cars/search?${params.toString()}`
          );
          const data = await response.json();

          if (data.length === 0) {
            alert("No matching cars found 😢");
          }

          displayCars(data); // 👈 Make sure this function handles rendering
        } catch (err) {
          console.error("🚨 Error fetching matching cars:", err);
          alert("Something went wrong while searching cars.");
        }
      }

      window.onload = loadCarsFromBackend;
      function slideCars(direction) {
        const container = document.getElementById("carList");
        const scrollAmount = 320; // Slightly more than card width + margin

        if (direction === "left") {
          container.scrollBy({ left: -scrollAmount, behavior: "smooth" });
        } else {
          container.scrollBy({ left: scrollAmount, behavior: "smooth" });
        }
      }
      //  booking form
      // Toggle return location visibility based on checkbox
      document
        .getElementById("sameLocation")
        .addEventListener("change", function () {
          const checked = this.checked;
          document.getElementById("return").style.display = checked
            ? "none"
            : "block";
          document.getElementById("returnLabel").style.display = checked
            ? "none"
            : "block";
        });

      document
        .getElementById("bookingForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const userEmail = localStorage.getItem("userEmail");
          if (!userEmail) {
            alert("⚠️ Please log in first to book a car.");
            return;
          }

          const bookingData = {
            email: userEmail,
            pickup: document.getElementById("pickup").value,
            returnLocation: document.getElementById("sameLocation").checked
              ? document.getElementById("pickup").value
              : document.getElementById("return").value,
            country: document.getElementById("country").value,
            ageCheck: document.getElementById("ageCheck").value,
            pickupDate: document.getElementById("pickupDate").value,
            pickupTime: document.getElementById("pickupTime").value,
            returnDate: document.getElementById("returnDate").value,
            returnTime: document.getElementById("returnTime").value,
            rentDuration: document.getElementById("rentDuration").value,
          };

          try {
            const response = await fetch("http://localhost:5000/api/bookings", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(bookingData),
            });

            const result = await response.json();

            if (response.ok) {
              alert("🎉 Booking successful!");
              this.reset();
            } else {
              alert(result.error || "Booking failed.");
            }
          } catch (err) {
            console.error("Booking error:", err);
            alert("Something went wrong while booking.");
          }
        });

      function logout() {
        localStorage.removeItem("userEmail");
        localStorage.removeItem("loginTime");
        alert("Logged out successfully.");
        window.location.reload();
      }

      window.addEventListener("DOMContentLoaded", () => {
        const text = "RentoCar";
        const output = document.getElementById("rentoText");
        output.textContent = text;

        const userEmail = localStorage.getItem("userEmail");
        if (userEmail) {
          document.querySelector(".nav-links").innerHTML += `
      <span style="color:#bed754; margin-left:20px;">Welcome, ${userEmail}</span>
      <a href="#" onclick="logout()" style="margin-left:10px; color:#f88;">Logout</a>
    `;
        }

        // function logout() {
        //   localStorage.removeItem("userEmail");
        //   localStorage.removeItem("loginTime");
        //   alert("Logged out successfully.");
        //   window.location.reload();
        // }
      });
    </script>
